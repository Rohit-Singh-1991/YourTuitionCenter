name: Build YourTuitionCenter Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm install --no-package-lock
      - name: Build web app
        run: npm run build
      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android
        run: npx cap sync android
      - name: Generate upload signing key
        env:
          STORE_PASSWORD: ${{ secrets.PLAY_STORE_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PLAY_STORE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then STORE_PASSWORD="TempUpload_${{ github.run_id }}_ChangeMe"; fi
          if [ -z "$KEY_PASSWORD" ]; then KEY_PASSWORD="$STORE_PASSWORD"; fi
          keytool -genkeypair -v -keystore upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=YourTuitionCenter, OU=Mobile, O=App Publisher, L=Delhi, ST=Delhi, C=IN"
          echo "storePassword=$STORE_PASSWORD" > signing-summary.txt
          echo "keyPassword=$KEY_PASSWORD" >> signing-summary.txt
          echo "keyAlias=upload" >> signing-summary.txt
          echo "storeFile=upload-keystore.jks" >> signing-summary.txt
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
      - name: Build signed release AAB
        env:
          STORE_PASSWORD: ${{ secrets.PLAY_STORE_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PLAY_STORE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then STORE_PASSWORD="TempUpload_${{ github.run_id }}_ChangeMe"; fi
          if [ -z "$KEY_PASSWORD" ]; then KEY_PASSWORD="$STORE_PASSWORD"; fi
          cd android
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/upload-keystore.jks" -Pandroid.injected.signing.store.password="$STORE_PASSWORD" -Pandroid.injected.signing.key.alias=upload -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Rename and verify AAB
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab "YourTuitionCenter-release.aab"
          test -s "YourTuitionCenter-release.aab"
          unzip -t "YourTuitionCenter-release.aab" >/dev/null
          ls -lh "YourTuitionCenter-release.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: YourTuitionCenter-play-store-${{ github.run_number }}
          path: |
            YourTuitionCenter-release.aab
            upload-keystore.jks
            signing-summary.txt
          retention-days: 90
