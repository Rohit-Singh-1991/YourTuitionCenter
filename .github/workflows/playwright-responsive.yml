name: Responsive subscription smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - teachnation-base

permissions:
  contents: read

jobs:
  responsive-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-package-lock
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live responsive checks
        env:
          BASE_URL: https://yourtuitioncenter.vercel.app
        run: npx playwright test tests/responsive-subscription.spec.ts --reporter=list
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscription-responsive-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
